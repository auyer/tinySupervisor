name: "Lint and Test"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    uses: ./.github/workflows/py-lint.yaml
    name: lint
    with:
      path: .
  tests:
    uses: ./.github/workflows/py-tests.yaml
    name: tests
    with:
      path: .


[project]
name = "tinysupervisor"
version = "0.1.0"
description = "A process supervisor in Python, with DAG-like dependencies"
readme = "README.md"
authors = [
    { name = "Rafael Passos", email = "rafael@rcpassos.me" }
]
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.6.1",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    "tawazi>=0.6.2",
]

[project.urls]
GitLab = "https://gitlab.com/auyer/tinySupervisor"
CodeBerg = "https://codeberg.org/auyer/tinySupervisor"
GitHub = "https://github.com/auyer/tinySupervisor"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ty.rules]
possibly-unresolved-reference = "warn"

[tool.ruff]
exclude = [".venv"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint]
# Enable all flake8-bugbear (`B`) rules, in addition to the defaults.
extend-select = ["B"]

# Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests that exercise the full supervisor lifecycle (real processes)",
]
timeout = 60


